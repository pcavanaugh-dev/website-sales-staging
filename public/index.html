<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>CyberMark Staging Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f2ee;
      --surface: #ffffff;
      --ink: #16161a;
      --muted: #6b6a70;
      --line: #dedbd4;
      --accent: #d9461e;
      --ready: #1f7a4d;
      --progress: #a96a00;
      --radius: 6px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111114;
        --surface: #1a1a1f;
        --ink: #efede8;
        --muted: #9a99a0;
        --line: #2c2c33;
        --accent: #ff6a3d;
        --ready: #4cc48a;
        --progress: #e3a63a;
      }
    }
    :root[data-theme="dark"] {
      --bg: #111114;
      --surface: #1a1a1f;
      --ink: #efede8;
      --muted: #9a99a0;
      --line: #2c2c33;
      --accent: #ff6a3d;
      --ready: #4cc48a;
      --progress: #e3a63a;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 "Inter Tight", system-ui, sans-serif;
    }
    a { color: inherit; }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
    @media (min-width: 720px) { .wrap { padding: 0 40px; } }

    header { padding: 56px 0 32px; border-bottom: 1px solid var(--line); }
    .eyebrow { font: 500 12px/1 "JetBrains Mono", monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    h1 { font-size: clamp(32px, 6vw, 64px); line-height: 1; letter-spacing: -.03em; font-weight: 600; margin: 14px 0 0; }
    h1 span { color: var(--accent); }
    .stats { display: flex; gap: 28px; flex-wrap: wrap; margin-top: 28px; }
    .stat b { display: block; font-size: 28px; font-weight: 600; letter-spacing: -.02em; }
    .stat small { color: var(--muted); font: 12px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .06em; }

    .controls { display: flex; gap: 12px; flex-wrap: wrap; padding-top: 20px; padding-bottom: 20px; position: sticky; top: 0; background: var(--bg); z-index: 2; border-bottom: 1px solid var(--line); }
    .controls input, .controls select {
      font: inherit; color: var(--ink); background: var(--surface);
      border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; min-height: 44px;
    }
    .controls input { flex: 1 1 260px; }
    .controls select { flex: 0 1 200px; }
    .controls input:focus-visible, .controls select:focus-visible, a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 24px; padding: 32px 0 80px; }
    .site { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; }
    .thumb { aspect-ratio: 16 / 10; background: var(--line); display: block; overflow: hidden; position: relative; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
    .site:hover .thumb img { transform: scale(1.03); }
    .thumb .placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 12px "JetBrains Mono", monospace; }
    .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .meta { display: flex; justify-content: space-between; gap: 8px; font: 12px "JetBrains Mono", monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .status { display: inline-flex; align-items: center; gap: 6px; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .status.ready { color: var(--ready); }
    .status.in-progress { color: var(--progress); }
    h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; font-weight: 600; }
    h2 a { text-decoration: none; }
    h2 a:hover { color: var(--accent); }
    .summary { margin: 0; color: var(--muted); font-size: 14px; }
    .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; flex-wrap: wrap; }
    .btn {
      font: 500 13px/1 "Inter Tight", sans-serif; text-decoration: none; cursor: pointer;
      border: 1px solid var(--line); background: transparent; color: var(--ink);
      border-radius: var(--radius); padding: 0 12px; min-height: 36px; display: inline-flex; align-items: center;
    }
    .btn:hover { border-color: var(--ink); }
    .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .btn.primary:hover { background: var(--accent); border-color: var(--accent); }
    .empty { padding: 80px 0; color: var(--muted); text-align: center; grid-column: 1 / -1; }
    footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="eyebrow">CyberMark · Phoenix Metro · Internal</div>
      <h1>Restaurant staging sites<span>.</span></h1>
      <div class="stats" aria-live="polite">
        <div class="stat"><b id="stat-total">–</b><small>Sites</small></div>
        <div class="stat"><b id="stat-ready">–</b><small>Ready to send</small></div>
        <div class="stat"><b id="stat-cities">–</b><small>Cities</small></div>
      </div>
    </div>
  </header>

  <div class="controls wrap" role="search">
    <input id="q" type="search" placeholder="Search restaurant, cuisine, city…" aria-label="Search sites" autocomplete="off">
    <select id="city" aria-label="Filter by city"><option value="">All cities</option></select>
    <select id="status" aria-label="Filter by status">
      <option value="">Any status</option>
      <option value="ready">Ready</option>
      <option value="in-progress">In progress</option>
    </select>
  </div>

  <main class="wrap">
    <div class="grid" id="grid" aria-live="polite"></div>
  </main>

  <footer>
    <div class="wrap">Staging previews for prospect review. Not indexed by search engines.</div>
  </footer>

  <script>
    const grid = document.getElementById("grid");
    const q = document.getElementById("q");
    const city = document.getElementById("city");
    const status = document.getElementById("status");
    let sites = [];

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    function card(s) {
      const url = s.url;
      const thumb = s.preview
        ? `<img src="${esc(url + s.preview)}" alt="" loading="lazy" width="1280" height="800">`
        : `<span class="placeholder">No preview yet</span>`;
      return `<article class="site">
        <a class="thumb" href="${esc(url)}" tabindex="-1" aria-hidden="true">${thumb}</a>
        <div class="body">
          <div class="meta"><span>${esc(s.city)} · ${esc(s.cuisine)}</span><span class="status ${esc(s.status)}">${s.status === "ready" ? "Ready" : "In progress"}</span></div>
          <h2><a href="${esc(url)}">${esc(s.name)}</a></h2>
          <p class="summary">${esc(s.summary)}</p>
          <div class="actions">
            <a class="btn primary" href="${esc(url)}">Open site</a>
            <button class="btn" type="button" data-copy="${esc(url)}">Copy link</button>
            <a class="btn" href="${esc(s.sourceUrl)}" target="_blank" rel="noopener">Current site ↗</a>
          </div>
        </div>
      </article>`;
    }

    function render() {
      const term = q.value.trim().toLowerCase();
      const list = sites.filter((s) =>
        (!city.value || s.city === city.value) &&
        (!status.value || s.status === status.value) &&
        (!term || [s.name, s.city, s.cuisine, s.summary].join(" ").toLowerCase().includes(term)));
      grid.innerHTML = list.length ? list.map(card).join("") : `<p class="empty">No sites match.</p>`;
    }

    grid.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-copy]");
      if (!btn) return;
      const full = new URL(btn.dataset.copy, location.href).href;
      try {
        await navigator.clipboard.writeText(full);
        btn.textContent = "Copied";
      } catch {
        prompt("Copy this link:", full);
      }
      setTimeout(() => (btn.textContent = "Copy link"), 1600);
    });
    [q, city, status].forEach((el) => el.addEventListener("input", render));

    fetch("sites.json", { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : { sites: [] }))
      .catch(() => ({ sites: [] }))
      .then((data) => {
        sites = data.sites || [];
        const cities = [...new Set(sites.map((s) => s.city))].sort();
        city.insertAdjacentHTML("beforeend", cities.map((c) => `<option>${esc(c)}</option>`).join(""));
        document.getElementById("stat-total").textContent = sites.length;
        document.getElementById("stat-ready").textContent = sites.filter((s) => s.status === "ready").length;
        document.getElementById("stat-cities").textContent = cities.length;
        render();
      });
  </script>
</body>
</html>
